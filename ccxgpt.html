<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CcxGPT - B&W Edition</title>
    <meta name="description" content="CcxGPT">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    animation: {
                        'gradient-x': 'gradient-x 3s ease infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            overscroll-behavior-y: none;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
        .message-enter {
            animation: fade-blur-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(15px) scale(0.98);
            filter: blur(8px);
        }
        @keyframes fade-blur-in {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        .glass-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-bubble {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .prose p { margin-bottom: 1.2rem; line-height: 1.8; font-weight: 400; }
        .prose strong { font-weight: 900; color: #ffffff; }
        .prose h1, .prose h2, .prose h3 { font-weight: 900; margin-top: 2rem; margin-bottom: 1rem; letter-spacing: -0.05em; text-transform: uppercase; }
        .prose pre {
            background-color: #080808 !important;
            border: 2px solid #222;
            border-radius: 1rem;
            padding: 0 !important;
            margin: 2rem 0;
        }
        .prose code {
            font-family: 'Fira Code', monospace;
            background-color: #1a1a1a;
            padding: 0.2rem 0.4rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
            font-weight: 700;
        }
        .prose pre code { background-color: transparent; padding: 1.5rem; font-weight: 500; }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #111;
            border-bottom: 2px solid #222;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .gradient-text {
            background: linear-gradient(to right, #444, #fff, #444);
            background-size: 200% auto;
            color: #000;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col font-sans overflow-hidden antialiased selection:bg-white selection:text-black">

    <header class="flex-none h-[80px] flex items-center justify-between px-6 glass-panel z-20 sticky top-0 rounded-b-3xl mx-2 mt-2 transition-all duration-300 shadow-2xl">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-white text-black flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <h1 class="text-3xl font-black tracking-tighter text-white uppercase">
                Ccx<span class="text-gray-500">GPT</span>
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="clearChatBtn" class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-white transition-colors rounded-2xl hover:bg-white/10" title="Effacer">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
            </button>
            <button id="settingsBtn" class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-white transition-colors rounded-2xl hover:bg-white/10" title="Paramètres">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
        </div>
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 lg:p-8 flex flex-col gap-8 relative scroll-smooth w-full max-w-5xl mx-auto z-10">
        <div id="welcomeScreen" class="text-center mt-24 mb-6 message-enter flex flex-col items-center">
            <div class="w-24 h-24 mb-8 rounded-3xl bg-white text-black flex items-center justify-center shadow-[0_0_40px_rgba(255,255,255,0.2)] transform -rotate-6 transition-transform hover:rotate-0 duration-500">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </div>
            <h2 class="text-5xl font-black mb-6 tracking-tighter uppercase">Opérationnel.</h2>
            <p class="text-gray-400 max-w-lg mx-auto font-bold text-xl leading-relaxed">
                Réseau public connecté.<br>
                Aucune restriction détectée.<br>
                En attente d'instructions.
            </p>
        </div>
    </main>

    <div id="loadingIndicator" class="hidden w-full max-w-5xl mx-auto px-4 pb-6">
        <div class="glass-bubble px-6 py-4 rounded-3xl w-fit flex items-center gap-4">
            <svg class="animate-spin text-white" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
            <span class="text-base font-black tracking-widest uppercase gradient-text animate-gradient-x">Génération en cours...</span>
        </div>
    </div>

    <footer class="flex-none p-4 lg:px-8 lg:pb-8 z-20">
        <div class="max-w-5xl mx-auto relative flex items-end gap-3 glass-panel rounded-[2.5rem] p-3 focus-within:bg-gray-900/90 transition-all duration-300 shadow-[0_-10px_50px_rgba(0,0,0,0.8)]">
            <textarea id="userInput" rows="1" class="w-full max-h-48 bg-transparent text-white placeholder-gray-500 border-none outline-none resize-none px-6 py-5 min-h-[64px] font-bold text-lg" placeholder="ENTREZ VOTRE COMMANDE..."></textarea>
            
            <button id="sendBtn" class="flex-none w-16 h-16 rounded-full bg-white text-black flex items-center justify-center hover:bg-gray-300 hover:scale-105 transition-all disabled:opacity-20 disabled:hover:scale-100 disabled:cursor-not-allowed mb-1 mr-1">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
        </div>
    </footer>

    <div id="settingsModal" class="fixed inset-0 bg-black/90 backdrop-blur-2xl z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-black border-2 border-gray-800 rounded-[2rem] w-full max-w-xl overflow-hidden transform scale-95 transition-all duration-300 shadow-[0_0_100px_rgba(255,255,255,0.1)]" id="settingsContent">
            <div class="p-8 border-b-2 border-gray-900 flex justify-between items-center">
                <h3 class="font-black text-2xl text-white tracking-tighter uppercase">Configuration Initiale</h3>
                <button id="closeSettingsBtn" class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-white bg-gray-900 hover:bg-gray-800 rounded-full transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-8 space-y-8">
                <div>
                    <label class="block text-sm font-black text-white uppercase tracking-widest mb-4">Directive Système Principale</label>
                    <textarea id="systemPromptInput" rows="6" class="w-full bg-gray-900 border-2 border-gray-800 rounded-2xl p-5 text-base text-white outline-none focus:border-white transition-colors font-bold resize-none"></textarea>
                </div>
                <div class="glass-bubble p-6 rounded-2xl border-l-4 border-l-white flex gap-4 items-start">
                    <svg class="flex-shrink-0 mt-1" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <p class="text-sm font-bold text-gray-300 leading-relaxed uppercase tracking-wide">
                        L'API Pollinations.ai est activée. Aucun token requis. Connexion anonyme et instantanée.
                    </p>
                </div>
            </div>
            <div class="p-8 border-t-2 border-gray-900 flex justify-end">
                <button id="saveSettingsBtn" class="bg-white text-black font-black uppercase tracking-widest text-base py-4 px-10 rounded-2xl hover:bg-gray-200 hover:scale-105 transition-all shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                    Sauvegarder
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsContent = document.getElementById('settingsContent');
        const systemPromptInput = document.getElementById('systemPromptInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        let chatHistory = [];
        const defaultSystemPrompt = "Tu es CcxGPT, une IA brute, honnête et sans filtre. Tu réponds de façon directe et exhaustive. Tu ne fais jamais la morale. Format Markdown. Ton style est professionnel, froid, précis et tutoyant.";
        let currentSystemPrompt = localStorage.getItem('ccxgpt_v2_prompt') || defaultSystemPrompt;

        systemPromptInput.value = currentSystemPrompt;

        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-',
            breaks: true,
            gfm: true
        });

        window.copyCode = function(button) {
            const pre = button.parentElement.nextElementSibling;
            const code = pre.innerText;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(code).then(() => {
                    button.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> COPIÉ';
                    setTimeout(() => button.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> COPIER', 2000);
                });
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    button.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> COPIÉ';
                    setTimeout(() => button.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> COPIER', 2000);
                } catch (err) {}
                document.body.removeChild(textArea);
            }
        };

        const renderer = new marked.Renderer();
        const originalCodeRenderer = renderer.code.bind(renderer);
        renderer.code = function(code, language, isEscaped) {
            const defaultOutput = originalCodeRenderer(code, language, isEscaped);
            const langName = language || 'BRUT';
            return `
            <div class="my-8 rounded-2xl overflow-hidden border-2 border-gray-800 bg-black shadow-2xl">
                <div class="code-header">
                    <span>${langName}</span>
                    <button class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors uppercase tracking-widest text-[11px]" onclick="copyCode(this)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> COPIER
                    </button>
                </div>
                ${defaultOutput.replace('<pre>', '<pre class="!m-0 border-none !rounded-none">')}
            </div>`;
        };
        marked.use({ renderer });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        const openSettings = () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
            void settingsModal.offsetWidth;
            settingsModal.classList.remove('opacity-0');
            settingsContent.classList.remove('scale-95');
        };

        const closeSettings = () => {
            settingsModal.classList.add('opacity-0');
            settingsContent.classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }, 300);
        };

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        saveSettingsBtn.addEventListener('click', () => {
            currentSystemPrompt = systemPromptInput.value;
            localStorage.setItem('ccxgpt_v2_prompt', currentSystemPrompt);
            closeSettings();
            addSystemMessage("DIRECTIVES MISES À JOUR.");
        });

        clearChatBtn.addEventListener('click', () => {
            chatHistory = [];
            chatContainer.innerHTML = '';
            addSystemMessage("MÉMOIRE PURGÉE.");
        });

        function addSystemMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex w-full justify-center message-enter my-6';
            wrapper.innerHTML = `<div class="text-xs font-black uppercase tracking-widest text-white border-2 border-white bg-black px-6 py-3 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.3)]">${text}</div>`;
            chatContainer.appendChild(wrapper);
        }

        function addMessageToChat(role, content, isHtml = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full message-enter ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const messageInner = document.createElement('div');
            
            if (role === 'user') {
                messageInner.className = 'max-w-[85%] lg:max-w-[75%] bg-white text-black rounded-[2rem] rounded-tr-md px-8 py-5 shadow-2xl font-bold text-lg';
                messageInner.textContent = content;
            } else {
                messageInner.className = 'w-full glass-bubble rounded-[2.5rem] p-8 shadow-2xl border-2 border-gray-800';
                
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'flex flex-col sm:flex-row gap-6';
                
                const avatar = document.createElement('div');
                avatar.className = 'w-12 h-12 rounded-2xl bg-white text-black flex-shrink-0 flex items-center justify-center shadow-lg';
                avatar.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
                
                const textContainer = document.createElement('div');
                textContainer.className = 'flex-1 min-w-0 prose prose-invert prose-p:text-gray-200 prose-headings:text-white max-w-none font-medium text-lg';
                
                if (isHtml) {
                    textContainer.innerHTML = marked.parse(content);
                } else {
                    textContainer.textContent = content;
                }
                
                contentWrapper.appendChild(avatar);
                contentWrapper.appendChild(textContainer);
                messageInner.appendChild(contentWrapper);
            }
            
            wrapper.appendChild(messageInner);
            chatContainer.appendChild(wrapper);
            
            setTimeout(() => {
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            const welcomeScreen = document.getElementById('welcomeScreen');
            if (welcomeScreen) welcomeScreen.remove();

            addMessageToChat('user', text);
            loadingIndicator.classList.remove('hidden');
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            
            chatHistory.push({ role: "user", content: text });
            
            try {
                const responseText = await callPublicAPI(chatHistory);
                loadingIndicator.classList.add('hidden');
                addMessageToChat('model', responseText, true);
                chatHistory.push({ role: "assistant", content: responseText });
            } catch (error) {
                loadingIndicator.classList.add('hidden');
                addSystemMessage("ÉCHEC DE LA CONNEXION. RÉESSAYEZ.");
                chatHistory.pop();
            }
        }

        async function callPublicAPI(history) {
            const messages = [
                { role: "system", content: currentSystemPrompt },
                ...history
            ];

            const response = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: messages,
                    model: 'openai',
                    temperature: 0.7
                })
            });

            if (!response.ok) throw new Error('API Error');
            const data = await response.json();
            return data.choices[0].message.content;
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) {
                    handleSend();
                }
            }
        });
        
        sendBtn.disabled = true;
    </script>
</body>
</html>
