<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CcxGPT - Premium UI</title>
    <meta name="description" content="Interface premium pour CcxGPT">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Marked & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dark: {
                            bg: '#09090b',
                            surface: '#18181b',
                            border: '#27272a',
                            text: '#f4f4f5',
                            muted: '#a1a1aa'
                        },
                        accent: {
                            500: '#8b5cf6',
                            600: '#7c3aed'
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'gradient-xy': 'gradientXY 8s ease infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        gradientXY: {
                            '0%, 100%': {
                                'background-size': '400% 400%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '400% 400%',
                                'background-position': 'right center'
                            }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #09090b;
        }
        body {
            background-color: var(--bg-color);
            color: #f4f4f5;
            overscroll-behavior-y: none;
            /* Subtil motif de fond */
            background-image: radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, rgba(56, 189, 248, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
        }
        
        /* Scrollbar élégante */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Utilitaires Glassmorphism */
        .glass {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-input {
            background: rgba(39, 39, 42, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Markdown Styling */
        .prose p { margin-bottom: 1rem; line-height: 1.7; }
        .prose strong { color: #fff; font-weight: 600; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose h1, .prose h2, .prose h3 { color: #fff; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .prose a { color: #a78bfa; text-decoration: underline; text-underline-offset: 2px; }
        .prose a:hover { color: #c4b5fd; }
        
        /* Code blocks */
        .prose pre {
            background: #0d0d0f !important;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 0 !important;
            margin: 1.5rem 0;
            overflow: hidden;
        }
        .prose code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }
        .prose :not(pre) > code {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.375rem;
            color: #e4e4e7;
        }
        .prose pre code {
            display: block;
            padding: 1rem;
            overflow-x: auto;
            background: transparent !important;
            color: #e4e4e7;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: #18181b;
            border-bottom: 1px solid #27272a;
            font-size: 0.75rem;
            color: #a1a1aa;
            font-family: 'Inter', sans-serif;
        }
        .mac-dots {
            display: flex;
            gap: 6px;
        }
        .mac-dots div {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Animations */
        .msg-enter { animation: fadeInUp 0.4s ease-out forwards; }
        
        .typing-indicator span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background-color: #a1a1aa;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Textarea auto-resize fix */
        textarea {
            scrollbar-width: none; /* Firefox */
        }
        textarea::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col font-sans overflow-hidden text-sm md:text-base selection:bg-accent-500/30 selection:text-white">

    <header class="flex-none h-16 flex items-center justify-between px-4 md:px-6 glass z-20 border-b border-dark-border shadow-sm">
        <div class="flex items-center gap-3">
            <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 shadow-[0_0_15px_rgba(99,102,241,0.4)]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 2.1 7.1"/><path d="M12 12l9.9 4.9"/></svg>
            </div>
            <div class="flex flex-col">
                <h1 class="font-bold text-white tracking-tight flex items-center gap-2">
                    CcxGPT
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </h1>
            </div>
            
            <!-- Model Selector -->
            <div class="hidden md:flex ml-4 bg-dark-surface border border-dark-border rounded-lg p-1">
                <button id="modelProBtn" class="px-3 py-1 text-xs font-medium rounded-md bg-dark-border text-white transition-colors" onclick="selectModel('gemini-1.5-pro')">
                    1.5 Pro (Smart)
                </button>
                <button id="modelFlashBtn" class="px-3 py-1 text-xs font-medium rounded-md text-dark-muted hover:text-white transition-colors" onclick="selectModel('gemini-3-flash-preview')">
                    3.0 Flash (Fast)
                </button>
            </div>
        </div>
        
        <div class="flex items-center gap-1 md:gap-2">
            <button id="clearChatBtn" class="p-2 text-dark-muted hover:text-white hover:bg-dark-surface rounded-lg transition-all" title="Nouvelle conversation">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
            </button>
            <button id="settingsBtn" class="p-2 text-dark-muted hover:text-white hover:bg-dark-surface rounded-lg transition-all" title="Paramètres">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>
    </header>

    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 py-8 md:p-8 flex flex-col gap-6 relative scroll-smooth w-full max-w-4xl mx-auto z-10 pb-32">
        
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full min-h-[50vh] msg-enter">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mb-6 shadow-lg shadow-purple-500/20">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 2.1 7.1"/><path d="M12 12l9.9 4.9"/></svg>
            </div>
            <h2 class="text-2xl md:text-3xl font-semibold mb-2 text-white text-center">Comment puis-je vous aider ?</h2>
            <p class="text-dark-muted text-center mb-10 max-w-md">L'IA est prête. Posez une question complexe, demandez du code ou générez du texte.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-2xl">
                <button class="suggestion-btn text-left p-4 rounded-xl bg-dark-surface border border-dark-border hover:bg-dark-border transition-colors flex flex-col gap-2 group">
                    <span class="text-sm font-medium text-white group-hover:text-accent-500 transition-colors">Explique-moi la physique quantique</span>
                    <span class="text-xs text-dark-muted">En termes simples, comme si j'avais 10 ans.</span>
                </button>
                <button class="suggestion-btn text-left p-4 rounded-xl bg-dark-surface border border-dark-border hover:bg-dark-border transition-colors flex flex-col gap-2 group">
                    <span class="text-sm font-medium text-white group-hover:text-accent-500 transition-colors">Générer un script Python</span>
                    <span class="text-xs text-dark-muted">Pour scraper les titres d'une page web.</span>
                </button>
                <button class="suggestion-btn text-left p-4 rounded-xl bg-dark-surface border border-dark-border hover:bg-dark-border transition-colors flex flex-col gap-2 group">
                    <span class="text-sm font-medium text-white group-hover:text-accent-500 transition-colors">Écris un e-mail professionnel</span>
                    <span class="text-xs text-dark-muted">Pour demander une augmentation à mon boss.</span>
                </button>
                <button class="suggestion-btn text-left p-4 rounded-xl bg-dark-surface border border-dark-border hover:bg-dark-border transition-colors flex flex-col gap-2 group">
                    <span class="text-sm font-medium text-white group-hover:text-accent-500 transition-colors">Brainstorming d'idées</span>
                    <span class="text-xs text-dark-muted">Trouver un nom pour ma startup tech.</span>
                </button>
            </div>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 w-full z-20 pointer-events-none">
        <div class="absolute inset-0 bg-gradient-to-t from-[#09090b] via-[#09090b]/80 to-transparent"></div>
        <div class="max-w-4xl mx-auto px-4 pb-6 pt-10 relative pointer-events-auto">
            
            <div class="relative flex items-end gap-2 glass-input rounded-2xl p-2 focus-within:ring-1 focus-within:ring-accent-500/50 transition-all shadow-xl border border-dark-border">
                
                <div class="flex-none p-2 text-dark-muted hover:text-white cursor-pointer transition-colors" title="Joindre un fichier (Simulation)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </div>
                
                <textarea id="userInput" rows="1" class="w-full max-h-[200px] bg-transparent text-white placeholder-dark-muted border-none outline-none resize-none py-2.5 px-1 font-normal leading-relaxed" placeholder="Envoyer un message à CcxGPT..."></textarea>
                
                <button id="sendBtn" class="flex-none p-2 rounded-xl bg-white text-black hover:bg-gray-200 transition-colors disabled:opacity-30 disabled:hover:bg-white disabled:cursor-not-allowed mb-0.5 mr-0.5 flex items-center justify-center">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
            </div>
            <div class="text-center mt-2 text-[10px] text-dark-muted">
                L'IA peut faire des erreurs. Considérez vérifier les informations importantes.
            </div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-dark-surface border border-dark-border rounded-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-all duration-300 shadow-2xl" id="settingsContent">
            <div class="p-5 border-b border-dark-border flex justify-between items-center bg-dark-bg/50">
                <h3 class="font-semibold text-lg text-white">Paramètres du Modèle</h3>
                <button id="closeSettingsBtn" class="text-dark-muted hover:text-white transition-colors">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="p-6 space-y-5">
                <div>
                    <label class="block text-sm font-medium text-dark-muted mb-2">Instructions Système (Prompt)</label>
                    <textarea id="systemPromptInput" rows="4" class="w-full bg-dark-bg border border-dark-border rounded-xl p-3 text-sm text-white outline-none focus:border-accent-500 transition-colors resize-none"></textarea>
                    <p class="text-xs text-dark-muted mt-2">Définit le comportement global de l'IA (personnalité, formatage).</p>
                </div>
            </div>
            <div class="p-5 border-t border-dark-border bg-dark-bg/50 flex justify-end">
                <button id="saveSettingsBtn" class="bg-white text-black font-medium text-sm py-2 px-6 rounded-lg hover:bg-gray-200 transition-colors">
                    Enregistrer
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const settingsContent = document.getElementById('settingsContent');
        const systemPromptInput = document.getElementById('systemPromptInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        
        let chatHistory = [];
        let currentModel = 'gemini-1.5-pro'; // Modèle par défaut (plus intelligent)
        
        // Initialisation du prompt système
        const defaultSystemPrompt = "Tu es CcxGPT, une IA de pointe développée pour être extrêmement utile, directe et précise. Tu réponds en Markdown. Ton ton est professionnel mais accessible. Si on te demande du code, fournis des explications claires.";
        let currentSystemPrompt = localStorage.getItem('ccxgpt_v3_prompt') || defaultSystemPrompt;
        systemPromptInput.value = currentSystemPrompt;

        // Configuration de Marked.js avec Highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-',
            breaks: true,
            gfm: true
        });

        // Fonction de copie du code
        window.copyCode = function(button) {
            const codeBlock = button.closest('.code-wrapper').querySelector('code');
            const code = codeBlock.innerText;
            
            navigator.clipboard.writeText(code).then(() => {
                const originalHtml = button.innerHTML;
                button.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copié';
                button.classList.add('text-emerald-400');
                setTimeout(() => {
                    button.innerHTML = originalHtml;
                    button.classList.remove('text-emerald-400');
                }, 2000);
            }).catch(err => {
                console.error('Erreur de copie:', err);
            });
        };

        // Rendu personnalisé pour les blocs de code
        const renderer = new marked.Renderer();
        const originalCodeRenderer = renderer.code.bind(renderer);
        renderer.code = function(code, language, isEscaped) {
            const defaultOutput = originalCodeRenderer(code, language, isEscaped);
            const langName = (language || 'TEXTE').toUpperCase();
            
            return `
            <div class="code-wrapper relative my-4 rounded-xl overflow-hidden border border-dark-border bg-[#0d0d0f]">
                <div class="code-header">
                    <div class="mac-dots">
                        <div class="bg-red-500/80"></div>
                        <div class="bg-yellow-500/80"></div>
                        <div class="bg-green-500/80"></div>
                    </div>
                    <span class="text-xs font-mono font-medium ml-2">${langName}</span>
                    <button class="flex items-center gap-1.5 hover:text-white transition-colors ml-auto text-xs" onclick="copyCode(this)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        Copier
                    </button>
                </div>
                ${defaultOutput.replace('<pre>', '<pre class="!m-0 border-none !rounded-none">')}
            </div>`;
        };
        marked.use({ renderer });

        // Redimensionnement automatique du textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        // Gestion du sélecteur de modèle
        window.selectModel = function(modelId) {
            currentModel = modelId;
            const proBtn = document.getElementById('modelProBtn');
            const flashBtn = document.getElementById('modelFlashBtn');
            
            if (modelId === 'gemini-1.5-pro') {
                proBtn.className = "px-3 py-1 text-xs font-medium rounded-md bg-dark-border text-white transition-colors";
                flashBtn.className = "px-3 py-1 text-xs font-medium rounded-md text-dark-muted hover:text-white transition-colors";
                addSystemMessage("Basculé sur le moteur : Gemini 1.5 Pro (Haute Qualité)");
            } else {
                flashBtn.className = "px-3 py-1 text-xs font-medium rounded-md bg-dark-border text-white transition-colors";
                proBtn.className = "px-3 py-1 text-xs font-medium rounded-md text-dark-muted hover:text-white transition-colors";
                addSystemMessage("Basculé sur le moteur : Gemini 3.0 Flash (Haute Vitesse)");
            }
        };

        // Gestion de la modale des paramètres
        const openSettings = () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
            void settingsModal.offsetWidth;
            settingsModal.classList.remove('opacity-0');
            settingsContent.classList.remove('scale-95');
        };

        const closeSettings = () => {
            settingsModal.classList.add('opacity-0');
            settingsContent.classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }, 300);
        };

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        saveSettingsBtn.addEventListener('click', () => {
            currentSystemPrompt = systemPromptInput.value;
            localStorage.setItem('ccxgpt_v3_prompt', currentSystemPrompt);
            closeSettings();
            addSystemMessage("Comportement système mis à jour.");
        });

        clearChatBtn.addEventListener('click', () => {
            chatHistory = [];
            const msgs = document.querySelectorAll('.chat-msg, .system-msg');
            msgs.forEach(m => m.remove());
            if(welcomeScreen) welcomeScreen.style.display = 'flex';
            userInput.focus();
        });

        // Clique sur les suggestions
        document.querySelectorAll('.suggestion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                userInput.value = btn.querySelector('span:first-child').innerText;
                userInput.dispatchEvent(new Event('input'));
                handleSend();
            });
        });

        function addSystemMessage(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'system-msg flex w-full justify-center msg-enter my-2';
            wrapper.innerHTML = `<div class="text-xs font-medium text-dark-muted bg-dark-surface border border-dark-border px-4 py-1.5 rounded-full">${text}</div>`;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        }

        function createTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.id = 'typingIndicator';
            wrapper.className = 'chat-msg flex w-full justify-start msg-enter mb-6';
            wrapper.innerHTML = `
                <div class="flex gap-4 max-w-[85%] md:max-w-[80%]">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center mt-1">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 2.1 7.1"/><path d="M12 12l9.9 4.9"/></svg>
                    </div>
                    <div class="bg-dark-surface border border-dark-border rounded-2xl p-4 flex items-center">
                        <div class="typing-indicator flex items-center">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        function addMessageToChat(role, content) {
            const wrapper = document.createElement('div');
            wrapper.className = `chat-msg flex w-full msg-enter mb-6 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            if (role === 'user') {
                wrapper.innerHTML = `
                    <div class="max-w-[85%] md:max-w-[70%] bg-dark-surface border border-dark-border text-white rounded-2xl rounded-tr-sm px-5 py-3.5 shadow-sm text-sm md:text-base">
                        ${content.replace(/\n/g, '<br>')}
                    </div>
                `;
            } else {
                const parsedContent = marked.parse(content);
                wrapper.innerHTML = `
                    <div class="flex gap-3 md:gap-4 max-w-[100%] md:max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex-shrink-0 flex items-center justify-center mt-1 shadow-md shadow-purple-500/20">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 2.1 7.1"/><path d="M12 12l9.9 4.9"/></svg>
                        </div>
                        <div class="flex-1 min-w-0 prose prose-invert max-w-none pt-1 text-sm md:text-base text-gray-200">
                            ${parsedContent}
                        </div>
                    </div>
                `;
            }
            
            chatContainer.appendChild(wrapper);
            
            // Appliquer highlight.js sur les nouveaux blocs
            if (role === 'model') {
                wrapper.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }
            
            scrollToBottom();
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // Reset UI
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            if (welcomeScreen) welcomeScreen.style.display = 'none';

            addMessageToChat('user', text);
            
            chatHistory.push({ role: "user", content: text });
            
            const typingIndicator = createTypingIndicator();
            
            try {
                const responseText = await callGeminiAPI(chatHistory);
                typingIndicator.remove();
                addMessageToChat('model', responseText);
                chatHistory.push({ role: "assistant", content: responseText });
            } catch (error) {
                console.error("API Error:", error);
                typingIndicator.remove();
                addSystemMessage(`Erreur de connexion : ${error.message}`);
                chatHistory.pop(); // Remove the user message from history on failure
            }
        }

        // Appel à l'API (avec logique de fallback pour exponential backoff basique)
        async function callGeminiAPI(history, retries = 2) {
            const apiKey = ""; // Canvas fournit automatiquement la clé
            // Utilisation dynamique du modèle choisi par l'utilisateur
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`;

            const contents = history.map(msg => ({
                role: msg.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: msg.content }]
            }));

            const payload = {
                contents: contents,
                systemInstruction: {
                    parts: [{ text: currentSystemPrompt }]
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    return candidate.content.parts[0].text;
                } else {
                    throw new Error("Format de réponse non reconnu.");
                }
            } catch(e) {
                if (retries > 0) {
                    // Exponential backoff
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    return callGeminiAPI(history, retries - 1);
                } else {
                    throw e;
                }
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) {
                    handleSend();
                }
            }
        });
        
        sendBtn.disabled = true;
    </script>
</body>
</html>
