<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Générateur Officiel 2026 v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e5e7eb; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        #editor-panel { transition: all 0.3s; }
        #preview-area { width: 210mm; min-height: 297mm; padding: 20mm; background: white; margin: 0 auto; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: none; position: relative; }
        
        /* Police officielle pour le rendu */
        .font-officiel { font-family: 'Times New Roman', Times, serif; }
        .font-mono { font-family: 'Courier New', Courier, monospace; }

        @media print {
            @page { margin: 0; size: auto; }
            body { background: white; }
            #editor-panel { display: none; }
            #preview-area { display: block; width: 100%; height: 100%; box-shadow: none; margin: 0; padding: 20mm; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Barre d'état -->
    <div class="bg-white shadow-md z-50 p-3 flex justify-between items-center border-b-2 border-gray-200 no-print">
        <div id="risk-meter" class="px-4 py-2 rounded bg-green-500 text-white text-sm uppercase tracking-wider flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>
            <span id="risk-text">Risque: Faible</span>
        </div>
        <div class="text-xs text-gray-500 font-mono">Mode: Expert 2026</div>
    </div>

    <!-- Interface Saisie -->
    <div id="editor-panel" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="bg-white p-4 rounded shadow border border-gray-200 grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Type</label>
                <select id="docType" class="w-full p-2 border border-gray-300 rounded text-sm" onchange="render()">
                    <option value="bulletin">Fiche de Paie 2026 (Officielle)</option>
                    <option value="contrat_cdi">Contrat CDI</option>
                    <option value="contrat_cdd">Contrat CDD</option>
                    <option value="attestation">Attestation de Travail (France Travail)</option>
                    <option value="cpam">Feuille de Soins CPAM</option>
                    <option value="carnet">Carnet de Santé</option>
                    <option value="diplome">Attestation / Diplôme</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Date</label>
                <input type="date" id="inputDate" class="w-full p-2 border border-gray-300 rounded text-sm" oninput="render()">
            </div>
        </div>

        <div class="bg-white p-4 rounded shadow border border-gray-200 space-y-3">
            <h3 class="text-sm font-bold text-gray-500 uppercase border-b pb-2">Entité (Employeur)</h3>
            <input type="text" id="inputOrg" placeholder="Nom de l'Entreprise" class="w-full p-2 border border-gray-300 rounded text-sm font-bold" oninput="render()">
            <input type="text" id="inputOrgAddress" placeholder="Adresse complète" class="w-full p-2 border border-gray-300 rounded text-xs" oninput="render()">
            <input type="text" id="inputSiret" placeholder="SIRET" class="w-full p-2 border border-gray-300 rounded text-xs" oninput="render()">
            <input type="text" id="inputPlace" placeholder="Lieu de signature (ex: Paris)" class="w-full p-2 border border-gray-300 rounded text-xs" oninput="render()">
        </div>

        <div class="bg-white p-4 rounded shadow border border-gray-200 space-y-3">
            <h3 class="text-sm font-bold text-gray-500 uppercase border-b pb-2">Salarié</h3>
            <input type="text" id="inputName" placeholder="Nom" class="w-full p-2 border border-gray-300 rounded text-sm font-bold uppercase" oninput="render()">
            <input type="text" id="inputPrenom" placeholder="Prénom" class="w-full p-2 border border-gray-300 rounded text-sm" oninput="render()">
            <input type="text" id="inputPoste" placeholder="Poste / Catégorie" class="w-full p-2 border border-gray-300 rounded text-xs" oninput="render()">
            <input type="text" id="inputCodeConvo" placeholder="Code Convention (ex: 1524)" class="w-full p-2 border border-gray-300 rounded text-xs" oninput="render()">
        </div>

        <!-- Champs dynamiques pour la paie -->
        <div id="paie-fields" class="bg-blue-50 p-4 rounded shadow border border-blue-200 space-y-3">
            <h3 class="text-sm font-bold text-blue-700 uppercase border-b border-blue-200 pb-2">Paramètres Salaire</h3>
            <input type="number" id="inputBrut" placeholder="Salaire Brut (€)" class="w-full p-2 border border-gray-300 rounded text-sm font-mono" oninput="render()">
            <input type="number" id="inputHeures" placeholder="Heures travaillées (ex: 151.67)" class="w-full p-2 border border-gray-300 rounded text-sm font-mono" oninput="render()">
            <input type="text" id="inputDetails" placeholder="Observations / Détails" class="w-full p-2 border border-gray-300 rounded text-xs" oninput="render()">
        </div>

        <!-- Champs dynamiques pour les contrats -->
        <div id="contract-fields" class="hidden bg-purple-50 p-4 rounded shadow border border-purple-200 space-y-3">
            <h3 class="text-sm font-bold text-purple-700 uppercase border-b border-purple-200 pb-2">Détails du Contrat</h3>
            <input type="text" id="inputIntitulé" placeholder="Intitulé du poste (ex: Développeur Web)" class="w-full p-2 border border-gray-300 rounded text-sm" oninput="render()">
            <input type="number" id="inputSalaireBase" placeholder="Salaire de base (ex: 3500)" class="w-full p-2 border border-gray-300 rounded text-sm font-mono" oninput="render()">
            
            <div id="cdd-fields" class="hidden">
                <label class="block text-xs font-bold text-purple-700 mb-1">Date de fin du CDD</label>
                <input type="date" id="inputDateFinCdd" class="w-full p-2 border border-gray-300 rounded text-sm" oninput="render()">
            </div>
        </div>

        <div class="flex justify-center pt-4 no-print">
            <button onclick="window.print()" class="bg-blue-700 hover:bg-blue-800 text-white px-8 py-4 rounded-full font-bold shadow-lg transform transition active:scale-95 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                CRÉER LE DOCUMENT
            </button>
        </div>
    </div>

    <!-- Rendu A4 -->
    <div id="preview-area"></div>

    <script>
        const REPUBLIC_IMG = 'https://upload.wikimedia.org/wikipedia/commons/c/c3/Coat_of_arms_of_France.svg';
        
        // Initialisation
        document.getElementById('inputDate').valueAsDate = new Date();
        document.getElementById('inputDateFinCdd').valueAsDate = new Date(new Date().setFullYear(new Date().getFullYear() + 1));
        document.getElementById('inputPlace').value = 'Paris';
        document.getElementById('inputCodeConvo').value = '1524';
        document.getElementById('inputHeures').value = '151.67';

        // Gestion de l'affichage des champs
        function updateFields() {
            const type = document.getElementById('docType').value;
            const isPaie = type === 'bulletin';
            const isContract = type.startsWith('contrat_');
            
            document.getElementById('paie-fields').style.display = isPaie ? 'block' : 'none';
            document.getElementById('contract-fields').style.display = isContract ? 'block' : 'none';
            
            if (isContract) {
                const isCdd = type === 'contrat_cdd';
                document.getElementById('cdd-fields').classList.toggle('hidden', !isCdd);
            }

            render();
        }

        document.getElementById('docType').addEventListener('change', updateFields);
        updateFields();

        function getVal(id) {
            const val = document.getElementById(id).value;
            if (id === 'inputName' || id === 'inputPrenom') return val.toUpperCase();
            return val;
        }

        function updateRisk() {
            const org = getVal('inputOrg');
            const nom = getVal('inputName');
            const prenom = getVal('inputPrenom');
            const date = getVal('inputDate');
            
            let score = 0;
            if (org) score++;
            if (nom) score++;
            if (prenom) score++;
            if (date) score++;

            const meter = document.getElementById('risk-meter');
            const text = document.getElementById('risk-text');
            
            if (score < 4) {
                meter.className = "px-4 py-2 rounded text-white text-sm uppercase tracking-wider flex items-center gap-2 bg-red-600 shadow-inner";
                text.innerText = "Risque: ÉLEVÉ (Manque données)";
            } else {
                meter.className = "px-4 py-2 rounded text-white text-sm uppercase tracking-wider flex items-center gap-2 bg-green-600 shadow-inner";
                text.innerText = "Risque: FAIBLE (Structure complète)";
            }
        }

        function render() {
            updateRisk();
            const type = document.getElementById('docType').value;
            const org = getVal('inputOrg') || "[ENTITÉ]";
            const orgAddr = getVal('inputOrgAddress');
            const siret = getVal('inputSiret');
            const nom = getVal('inputName');
            const prenom = getVal('inputPrenom');
            const poste = getVal('inputPoste');
            const codeConvo = getVal('inputCodeConvo');
            const date = getVal('inputDate');
            const brut = parseFloat(getVal('inputBrut')) || 0;
            const heures = parseFloat(getVal('inputHeures')) || 151.67;
            const details = getVal('inputDetails');
            const lieu = getVal('inputPlace');
            const intitulé = getVal('inputIntitulé');
            const salaireBase = getVal('inputSalaireBase');
            const dateFinCdd = getVal('inputDateFinCdd');
            
            const dateFormatted = new Date(date).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });
            const idDoc = Math.floor(Math.random() * 10000000).toString();

            let html = '';

            if (type === 'bulletin') {
                const cotisationSalariée = brut * 0.22; 
                const netSocial = brut - cotisationSalariée;
                const netA Payer = netSocial; 

                html = `
                <div class="font-sans text-black text-[10px] leading-tight relative">
                    <div class="border-b border-gray-800 pb-2 mb-2 flex justify-between">
                        <div>
                            <h1 class="text-lg font-bold uppercase text-gray-900">${org}</h1>
                            <p class="text-xs">${orgAddr}</p>
                            <p class="text-[9px] text-gray-500">SIRET: ${siret || '000 000 000 00000'}</p>
                        </div>
                        <div class="text-right">
                            <img src="${REPUBLIC_IMG}" class="w-8 h-auto inline-block opacity-60" alt="">
                            <span class="font-bold uppercase text-xs ml-1">Bulletin de Paie</span>
                            <p class="text-[9px]">Période: ${dateFormatted}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-2 border-b border-gray-300 pb-2">
                        <div>
                            <p class="font-bold text-xs uppercase">Salarié</p>
                            <p class="font-bold text-sm uppercase">${nom} ${prenom}</p>
                            <p class="text-[9px]">Poste: ${poste || 'Employé'}</p>
                            <p class="text-[9px]">Convention: ${codeConvo || '1524'}</p>
                        </div>
                        <div>
                            <p class="font-bold text-xs uppercase">Réf</p>
                            <p class="text-[9px] font-mono">N°: ${idDoc}</p>
                            <p class="text-[9px]">Affilié: 1 00 00 00 000 00 00</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-xs uppercase">Heures</p>
                            <p class="text-[9px]">${heures} h</p>
                            <p class="text-[9px]">Rémunération brute</p>
                        </div>
                    </div>

                    <table class="w-full border-collapse border-t border-b border-gray-800 mb-2">
                        <thead class="bg-gray-200">
                            <tr>
                                <th class="border border-gray-600 p-1 text-left w-[10px]">N°</th>
                                <th class="border border-gray-600 p-1 text-left">Désignation</th>
                                <th class="border border-gray-600 p-1 text-right">Base</th>
                                <th class="border border-gray-600 p-1 text-right">Montant</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="bg-gray-100 font-bold"><td colspan="4" class="border border-gray-600 p-1">1. Salaires et éléments variables</td></tr>
                            <tr>
                                <td class="border border-gray-300 p-1 text-center">100</td>
                                <td class="border border-gray-300 p-1">Salaire de base</td>
                                <td class="border border-gray-300 p-1 text-right">${heures.toFixed(2)} h</td>
                                <td class="border border-gray-300 p-1 text-right">${brut.toFixed(2)} €</td>
                            </tr>
                            
                            <tr class="bg-gray-100 font-bold"><td colspan="4" class="border border-gray-600 p-1">2. Cotisations Salariées</td></tr>
                            <tr>
                                <td class="border border-gray-300 p-1 text-center">200</td>
                                <td class="border border-gray-300 p-1">Sécurité sociale</td>
                                <td class="border border-gray-300 p-1 text-right">${brut.toFixed(2)} €</td>
                                <td class="border border-gray-300 p-1 text-right text-red-600">-${(brut*0.10).toFixed(2)} €</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 p-1 text-center">210</td>
                                <td class="border border-gray-300 p-1">Retraite Complémentaire</td>
                                <td class="border border-gray-300 p-1 text-right">${brut.toFixed(2)} €</td>
                                <td class="border border-gray-300 p-1 text-right text-red-600">-${(brut*0.06).toFixed(2)} €</td>
                            </tr>
                            <tr>
                                <td class="border border-gray-300 p-1 text-center">220</td>
                                <td class="border border-gray-300 p-1">Assurance chômage</td>
                                <td class="border border-gray-300 p-1 text-right">${brut.toFixed(2)} €</td>
                                <td class="border border-gray-300 p-1 text-right text-red-600">-${(brut*0.03).toFixed(2)} €</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="border border-black p-2 flex justify-between items-center bg-gray-50">
                        <div class="text-xs">
                            <p class="font-bold">Net Social: <strong>${netSocial.toFixed(2)} €</strong></p>
                            <p class="font-bold">Net à Payer: <strong class="text-lg text-black">${netA Payer.toFixed(2)} €</strong></p>
                        </div>
                        <div class="text-right w-1/3 border-l border-gray-300 pl-2">
                            <p class="text-[9px]">Fait à ${lieu || 'Paris'}, le ${dateFormatted}</p>
                            <div class="mt-2 border-t border-gray-400 w-full h-8 flex items-center justify-center text-[9px] text-gray-400 italic">
                                Signature
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            else if (type === 'attestation') {
                html = `
                <div class="font-officiel text-black relative h-full flex flex-col justify-between">
                    <div class="flex justify-between items-center border-b-2 border-black pb-3 mb-8">
                        <div class="text-left">
                            <h1 class="text-xl font-bold uppercase tracking-widest text-gray-800">${org}</h1>
                            <p class="text-xs text-gray-600 mt-1">${orgAddr}</p>
                        </div>
                        <div class="text-right flex items-center gap-2">
                            <img src="${REPUBLIC_IMG}" class="w-12 h-auto opacity-90" alt="RF">
                            <div class="text-sm leading-tight">
                                <span class="font-bold block uppercase">RÉPUBLIQUE FRANÇAISE</span>
                                <span class="text-xs text-gray-500">Liberté · Égalité · Fraternité</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-center my-10">
                        <h2 class="text-2xl font-bold uppercase tracking-widest border-b border-gray-300 inline-block px-8 py-1 mb-6">Attestation de travail</h2>
                    </div>
                    <div class="flex-grow">
                        <p class="text-justify leading-relaxed text-sm mb-4">
                            Je soussigné(e), <strong>${org}</strong>, atteste que :
                        </p>
                        <div class="my-8 bg-gray-50 p-6 border border-gray-200">
                            <p class="text-center text-xs uppercase text-gray-500 mb-2">Monsieur / Madame</p>
                            <p class="text-center text-xl font-bold uppercase border-b border-gray-300 inline-block px-4 min-w-[200px]">${nom} ${prenom}</p>
                        </div>
                        <p class="text-justify leading-relaxed text-sm mb-4">
                            A été employé(e) au sein de notre entreprise du <strong>${new Date(date).toLocaleDateString('fr-FR')}</strong> au poste de <strong>${poste || 'Employé'}</strong>.
                        </p>
                    </div>
                    <div class="mt-8 text-right">
                        <p>Fait à <strong>${lieu || 'Paris'}</strong>,</p>
                        <p class="mt-2">Le <strong>${dateFormatted}</strong></p>
                        <div class="mt-12 w-56 border-t border-black pt-2 text-center text-xs text-gray-500">
                            Signature<br><br>
                            <div class="bg-gray-100 inline-block px-2 py-1 border border-gray-200 rounded">[CACHET ICI]</div>
                        </div>
                    </div>
                </div>`;
            }
            else if (type === 'contrat_cdi') {
                html = `
                <div class="font-officiel text-black relative text-sm leading-6">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold uppercase tracking-widest underline decoration-2 underline-offset-4">Contrat de Travail à Durée Indéterminée (CDI)</h1>
                    </div>

                    <div class="grid grid-cols-2 gap-8 mb-6">
                        <div>
                            <p class="font-bold border-b border-gray-300 mb-1">L'EMPLOYEUR</p>
                            <p class="font-bold text-base">${org}</p>
                            <p class="text-xs">Dont: ${orgAddr}</p>
                            <p class="text-xs">SIRET: ${siret || '000 000 000 00000'}</p>
                        </div>
                        <div>
                            <p class="font-bold border-b border-gray-300 mb-1">LE SALARIÉ</p>
                            <p class="font-bold text-base">${nom} ${prenom}</p>
                            <p class="text-xs">Domicilié à: ${getVal('inputOrgAddress') || 'Adresse du salarié'}</p>
                        </div>
                    </div>

                    <div class="mb-6">
                        <p class="font-bold border-b border-gray-300 mb-2">ARTICLE 1 - OBJET</p>
                        <p>Le salarié est engagé en qualité de <strong class="uppercase">${intitulé || poste || 'Employé'}</strong>.</p>
                    </div>

                    <div class="mb-6">
                        <p class="font-bold border-b border-gray-300 mb-2">ARTICLE 2 - RÉMUNÉRATION</p>
                        <p>Le salarié percevra une rémunation brute mensuelle de <strong>${salaireBase || '2500'} €</strong>, versée par virement ou chèque.</p>
                    </div>

                    <div class="mb-6">
                        <p class="font-bold border-b border-gray-300 mb-2">ARTICLE 3 - DURÉE DU TRAVAIL</p>
                        <p>La durée du travail est fixée à 35 heures hebdomadaires.</p>
                    </div>

                    <div class="flex justify-between items-end mt-12">
                        <div class="w-1/2">
                            <p class="mb-2">Le salarié reconnaît avoir reçu le présent contrat.</p>
                            <div class="border-t border-black w-full h-12"></div>
                        </div>
                        <div class="w-1/2 text-right">
                            <p class="mb-2">Fait à <strong>${lieu || 'Paris'}</strong>, le <strong>${dateFormatted}</strong></p>
                            <div class="border-t border-black w-48 h-12 inline-block"></div>
                        </div>
                    </div>
                </div>`;
            }
            else if (type === 'contrat_cdd') {
                html = `
                <div class="font-officiel text-black relative text-sm leading-6">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold uppercase tracking-widest underline decoration-2 underline-offset-4">Contrat de Travail à Durée Déterminée (CDD)</h1>
                    </div>

                    <div class="grid grid-cols-2 gap-8 mb-6">
                        <div>
                            <p class="font-bold border-b border-gray-300 mb-1">L'EMPLOYEUR</p>
                            <p class="font-bold text-base">${org}</p>
                            <p class="text-xs">Dont: ${orgAddr}</p>
                            <p class="text-xs">SIRET: ${siret || '000 000 000 00000'}</p>
                        </div>
                        <div>
                            <p class="font-bold border-b border-gray-300 mb-1">LE SALARIÉ</p>
                            <p class="font-bold text-base">${nom} ${prenom}</p>
                        </div>
                    </div>

                    <div class="mb-6">
                        <p class="font-bold border-b border-gray-300 mb-2">ARTICLE 1 - OBJET</p>
                        <p>Le salarié est engagé en qualité de <strong class="uppercase">${intitulé || poste || 'Employé'}</strong>.</p>
                    </div>

                    <div class="mb-6">
                        <p class="font-bold border-b border-gray-300 mb-2">ARTICLE 2 - DURÉE</p>
                        <p>Ce contrat est conclu pour une durée déterminée, du <strong>${dateFormatted}</strong> au <strong>${dateFinCdd ? new Date(dateFinCdd).toLocaleDateString('fr-FR') : '____'}</strong>.</p>
                    </div>

                    <div class="mb-6">
                        <p class="font-bold border-b border-gray-300 mb-2">ARTICLE 3 - RÉMUNÉRATION</p>
                        <p>Le salarié percevra une rémunation brute mensuelle de <strong>${salaireBase || '2500'} €</strong>.</p>
                    </div>

                    <div class="flex justify-between items-end mt-12">
                        <div class="w-1/2">
                            <p class="mb-2">Le salarié reconnaît avoir reçu le présent contrat.</p>
                            <div class="border-t border-black w-full h-12"></div>
                        </div>
                        <div class="w-1/2 text-right">
                            <p class="mb-2">Fait à <strong>${lieu || 'Paris'}</strong>, le <strong>${dateFormatted}</strong></p>
                            <div class="border-t border-black w-48 h-12 inline-block"></div>
                        </div>
                    </div>
                </div>`;
            }
            else if (type === 'cpam') {
                 html = `
                <div class="font-sans text-black relative">
                    <div class="flex justify-between items-start border-b-4 border-blue-700 pb-4 mb-6">
                        <div>
                            <h1 class="text-3xl font-bold text-blue-800 tracking-tight">CPAM</h1>
                            <p class="text-sm font-bold text-gray-600 uppercase">Caisse Primaire d'Assurance Maladie</p>
                        </div>
                        <div class="text-right">
                             <img src="${REPUBLIC_IMG}" class="w-10 h-auto opacity-50" alt="">
                        </div>
                    </div>
                    <div class="text-center mb-8">
                        <h2 class="text-lg font-bold text-blue-900 uppercase border-b border-blue-200 inline-block px-4 py-1">Feuille de Soins - Remboursement</h2>
                    </div>
                    <div class="border-2 border-blue-800 p-3 mb-6 bg-blue-50">
                        <p class="text-xs font-bold uppercase mb-1 text-blue-900">Ayant droit / Assuré</p>
                        <p class="text-lg font-bold uppercase">${nom} ${prenom}</p>
                        <p class="text-xs mt-1">N° Assurance: ${Math.floor(Math.random()*900000000)+100000000}</p>
                    </div>
                    <div class="flex justify-end mt-12">
                        <div class="text-right w-1/2">
                             <div class="border border-gray-300 h-20 w-full flex items-center justify-center text-gray-300 text-xs italic border-dashed border-2">[CACHET + SIGNATURE CPAM]</div>
                        </div>
                    </div>
                </div>`;
            }
            else if (type === 'carnet') {
                 html = `
                <div class="font-serif text-black relative h-full flex flex-col">
                    <div class="border-4 border-blue-800 p-4 min-h-[80vh] flex flex-col justify-between">
                        <div class="text-center border-b border-blue-200 pb-4 mb-4">
                            <img src="${REPUBLIC_IMG}" class="w-10 h-auto mx-auto mb-1 opacity-60" alt="">
                            <h1 class="text-xl font-bold text-blue-900 uppercase tracking-widest">Carnet de Santé</h1>
                        </div>
                        <div class="grid grid-cols-2 gap-6 mb-8">
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-500">Nom</label>
                                <div class="border-b border-gray-400 h-6 mb-2"></div>
                                <label class="text-[10px] uppercase font-bold text-gray-500">Prénom</label>
                                <div class="border-b border-gray-400 h-6"></div>
                            </div>
                            <div>
                                <label class="text-[10px] uppercase font-bold text-gray-500">Date de naissance</label>
                                <div class="border-b border-gray-400 h-6 mb-2">${dateFormatted}</div>
                                <label class="text-[10px] uppercase font-bold text-gray-500">Sexe</label>
                                <div class="border-b border-gray-400 h-6">M / F</div>
                            </div>
                        </div>
                        <div class="mt-auto text-center">
                            <div class="border border-gray-400 p-2 inline-block w-full max-w-xs">
                                <p class="text-[10px] text-gray-500 uppercase">Visa de la Mairie</p>
                                <div class="font-serif text-xl text-blue-800 rotate-[-3deg] mt-2">[Cachet ici]</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            else if (type === 'diplome') {
                 html = `
                <div class="font-serif text-black relative p-4 border-[12px] border-double border-gray-700 h-full">
                    <div class="text-center mb-8">
                        <h1 class="text-2xl font-bold uppercase tracking-widest mb-2">${org}</h1>
                        <div class="w-16 h-1 bg-black mx-auto mb-4"></div>
                        <p class="text-sm italic">Attestation de formation délivrée à</p>
                    </div>
                    <div class="text-center mb-12">
                        <h2 class="text-3xl font-bold uppercase tracking-wider mb-2">${nom} ${prenom}</h2>
                    </div>
                    <div class="text-center text-justify max-w-md mx-auto mb-12">
                        <p class="text-base leading-relaxed">Est habilité à porter le titre de: <span class="text-lg font-bold uppercase mt-2 block">${details || 'Expert Confirmé'}</span></p>
                    </div>
                    <div class="flex justify-between items-end mt-8">
                        <div class="w-1/3 text-center">
                            <img src="${REPUBLIC_IMG}" class="w-8 h-auto mb-2 opacity-60 mx-auto" alt="">
                            <p class="font-bold text-xs uppercase">Le Directeur</p>
                        </div>
                        <div class="w-1/3 text-right">
                            <p class="mb-6 text-sm">Fait à <strong>[VILLE]</strong>, le <strong>${dateFormatted}</strong></p>
                            <div class="border-t border-black w-full h-12 relative">
                                <span class="absolute bottom-1 right-2 text-gray-400 text-[10px] italic">Signature</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            document.getElementById('preview-area').innerHTML = html;
        }
    </script>
</body>
</html>
